<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Football Legends 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(
                135deg, #061b12, #123d24, #020b07
            );
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 25px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 60px);
            color: #65ff91;
            margin-bottom: 10px;
        }

        p {
            color: #d4e8d9;
            font-size: 18px;
        }

        .ball {
            font-size: 75px;
            margin: 20px;
        }

        .status {
            margin-top: 30px;
            color: #65ff91;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="ball">⚽</div>

        <h1>FOOTBALL LEGENDS 3D</h1>

        <p>THE NEXT GENERATION OF FOOTBALL</p>

        <p>Career • Matches • Multiplayer</p>

        <div class="status">
            INITIALIZING GAME...
        </div>
    </div>
</body>
</html>
